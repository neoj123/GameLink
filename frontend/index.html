<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullstack App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Fullstack App</h1>
      <p>Multi-language project with frontend and backend</p>
      <div id="user-info" style="display:none; margin-top:12px;">
        <span style="color:#00d2ff; font-weight:600;" id="display-username"></span>
        <span id="online-count" style="color:#888; font-size:0.8rem; margin-left:12px;"></span>
        <button onclick="logout()" style="font-size:0.8rem; padding:4px 12px; margin-left:12px;">Logout</button>
      </div>
    </header>
    <main>
      <section id="auth-section">
        <h2>Welcome Back</h2>
        <form id="login-form" onsubmit="login(event)">
          <input type="text" id="login-username" placeholder="Username" required>
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="submit" id="login-btn">Log In</button>
        </form>
        <p id="login-error" style="color:#ff4757;margin-top:8px;display:none;"></p>
        <p style="margin-top:16px;color:#888;">Don't have an account? <a href="#" onclick="showRegister(event)">Register</a></p>
      </section>
      <section id="register-section" style="display:none;">
        <h2>Create Account</h2>
        <form id="register-form" onsubmit="register(event)">
          <input type="text" id="reg-username" placeholder="Choose a username (min 3 chars)" required>
          <input type="password" id="reg-password" placeholder="Choose a password (min 6 chars)" required>
          <button type="submit" id="reg-btn">Register</button>
        </form>
        <p id="reg-error" style="color:#ff4757;margin-top:8px;display:none;"></p>
        <p style="margin-top:16px;color:#888;">Already have an account? <a href="#" onclick="showLogin(event)">Log In</a></p>
      </section>
      <section id="app-section" style="display:none;">
        <section class="status">
          <h2>Backend Status</h2>
          <p id="server-status"><span class="status-indicator offline" id="status-dot"></span>Checking...</p>
          <button id="btn-status" onclick="checkStatus()">Check Server</button>
          <p id="socket-status" style="margin-top:8px; font-size:0.9rem;"></p>
        </section>
        <section class="messages">
          <h2>Messages <button onclick="clearMessages()" style="font-size:0.8rem; padding:4px 12px; margin-left:12px;">Clear All</button></h2>
          <div id="toast-container" style="position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:8px;"></div>
          <div id="message-list"></div>
          <form id="message-form" onsubmit="sendMessage(event)">
            <input type="text" id="message-input" placeholder="Type a message..." required>
            <button type="submit" id="btn-submit">Send</button>
            <span id="btn-spinner" class="spinner" style="display:none;"></span>
          </form>
        </section>
        <section class="search">
          <h2>Search Messages</h2>
          <form onsubmit="searchMessages(event)">
            <input type="text" id="search-input" placeholder="Search..." minlength="2">
            <button type="submit">Search</button>
          </form>
          <div id="search-results" style="margin-top:12px;"></div>
        </section>
      </section>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
