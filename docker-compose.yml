version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: sqlite:latest
    ports:
      - "3001:3001"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

volumes:
  sqlite-data: